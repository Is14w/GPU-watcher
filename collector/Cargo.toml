[package]
name = "nova-collector"
version = "0.1.0"
edition = "2021"
description = "Headless SSH GPU collector for NOVA Watch"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
