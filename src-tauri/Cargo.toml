[package]
name = "gpu-watcher"
version = "0.1.0"
description = "A lightweight remote NVIDIA GPU monitor"
authors = ["NOVA Watch"]
edition = "2021"

[lib]
name = "gpu_watcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = { version = "0.63.3", default-features = false, features = ["flate2", "ring", "rsa"] }
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
